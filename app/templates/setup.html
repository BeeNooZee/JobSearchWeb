{% extends "base.html" %}
{% set hide_nav = true %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">🎯</div>
    <h1>Configuration initiale</h1>
    <p class="muted">Choisis le mot de passe qui protégera ton suivi d'alternance.</p>
    {% if msg %}<div class="flash err">{{ msg }}</div>{% endif %}
    <form method="post" action="/setup">
      <label>Mot de passe (≥ 6 caractères)</label>
      <input type="password" name="password" autofocus required minlength="6" autocomplete="new-password">
      <label>Confirmer</label>
      <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
      <button class="btn primary block" type="submit">Créer mon accès</button>
    </form>
  </div>
</div>
{% endblock %}
